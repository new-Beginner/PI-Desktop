name: Native scroll platform diagnostic
on:
  push:
    branches: [build/four-pr-preview9-6bbc]
    paths: [.github/workflows/native-motion-diagnostic.yml]
permissions:
  contents: read
jobs:
  native-control:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install the locked Electron runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pi-desktop/desktop exec install-electron
      - name: Compare native animation capability without application code
        run: |
          python - <<'PY'
          import ctypes, json, os, subprocess, tempfile
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          scratch = Path(tempfile.mkdtemp(prefix='native-scroll-control-', dir=os.environ['RUNNER_TEMP']))
          preference = ctypes.c_int()
          ok = ctypes.windll.user32.SystemParametersInfoW(0x1042, 0, ctypes.byref(preference), 0)
          print(json.dumps({'clientAreaAnimations': bool(preference.value) if ok else None}), flush=True)
          script = scratch / 'control.cjs'
          script.write_text(r"""
          const { app, BrowserWindow } = require('electron');
          const path = require('node:path'), fs = require('node:fs');
          const directory = process.env.PI_NATIVE_CONTROL_DIR, mode = process.env.PI_NATIVE_CONTROL_MODE;
          console.log('NATIVE_CONTROL_START '+JSON.stringify({mode,pid:process.pid}));
          if (mode === 'enabled') app.commandLine.appendSwitch('enable-smooth-scrolling');
          if (mode === 'disabled') app.commandLine.appendSwitch('disable-smooth-scrolling');
          app.disableHardwareAcceleration();
          const profile = path.join(directory, 'profile-' + mode);fs.mkdirSync(profile, {recursive:true});app.setPath('userData',profile);
          const watchdog=setTimeout(()=>app.exit(2),25000);
          app.whenReady().then(async()=>{try{
            const win=new BrowserWindow({show:true,width:900,height:700,webPreferences:{sandbox:true,contextIsolation:true,nodeIntegration:false,backgroundThrottling:false}});
            await win.loadURL('data:text/html;charset=utf-8,'+encodeURIComponent(`<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><style>body{margin:20px}#s{height:250px;width:600px;overflow:auto}#content{height:5000px}#target{height:40px}</style><div id="s"><div id="content"></div><div id="target">Target</div></div>`));
            win.focus();
            const js=expression=>win.webContents.executeJavaScript(expression);
            const measure=kind=>js(`(async()=>{
              const s=document.querySelector('#s');s.scrollTop=0;
              await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
              const target=s.scrollHeight-s.clientHeight, positions=[s.scrollTop], start=performance.now();
              if(${JSON.stringify(kind)}==='marker')document.querySelector('#target').scrollIntoView({behavior:'smooth',block:'end'});
              else s.scrollTo({top:target,behavior:'smooth'});
              return await new Promise(resolve=>{function sample(){positions.push(s.scrollTop);
                if((Math.abs(target-s.scrollTop)<=1&&positions.length>4)||performance.now()-start>3500){
                  resolve({kind:${JSON.stringify(kind)},reduced:matchMedia('(prefers-reduced-motion: reduce)').matches,target,arrived:Math.abs(target-s.scrollTop)<=1,intermediate:positions.filter(p=>p>1&&p<target-1).length,first:positions.slice(0,12),duration:performance.now()-start});
                }else requestAnimationFrame(sample);
              }requestAnimationFrame(sample);});
            })()`);
            console.log('NATIVE_CONTROL '+JSON.stringify({mode,stage:'system',result:await measure('scrollTo')}));
            win.webContents.debugger.attach('1.3');
            await win.webContents.debugger.sendCommand('Emulation.setEmulatedMedia',{features:[{name:'prefers-reduced-motion',value:'no-preference'}]});
            await js('new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))');
            for(const kind of ['scrollTo','marker'])console.log('NATIVE_CONTROL '+JSON.stringify({mode,stage:'no-preference',result:await measure(kind)}));
            win.webContents.debugger.detach();clearTimeout(watchdog);app.exit(0);
          }catch(error){console.error(error);clearTimeout(watchdog);app.exit(1);}});
          """, encoding='utf8')
          electron = subprocess.check_output(['node', '--input-type=module', '-e', "import {resolveElectronBinary} from './scripts/e2e/boot.mjs'; process.stdout.write(resolveElectronBinary(process.cwd()).electronBinary)"], cwd=root, text=True).strip()
          env = dict(os.environ, TMP=str(scratch), TEMP=str(scratch), TMPDIR=str(scratch))
          env.pop('ELECTRON_RUN_AS_NODE', None)
          for mode in ['default', 'enabled', 'disabled']:
              result = subprocess.run([electron, str(script)], cwd=root, env=dict(env, PI_NATIVE_CONTROL_DIR=str(scratch), PI_NATIVE_CONTROL_MODE=mode), capture_output=True, text=True, timeout=35)
              print(result.stdout, result.stderr, flush=True)
              result.check_returncode()
          PY
